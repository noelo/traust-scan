apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: traust-scan-clone
spec:
  params:
  - name: url
    type: string
  - name: revision
    type: string
    default: main
  workspaces:
  - name: output
  results:
  - name: repo-name
    description: Name of the cloned repository directory (repo/<name>)
  steps:
  - name: clone
    image: alpine/git:latest
    script: 'set -e

      repoName=$(basename "$(params.url)" .git)

      mkdir -p "$(workspaces.output.path)/repo"

      dest="$(workspaces.output.path)/repo/$repoName"

      rm -rf "$dest"

      git clone --depth 1 --branch "$(params.revision)" "$(params.url)" "$dest"

      printf ''%s'' "$repoName" > "$(results.repo-name.path)"

      '
